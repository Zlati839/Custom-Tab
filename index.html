       <!--------------------------Calculator---------------------------------------->
        <div class = "windoll" style = "width:20%; height:40%; top:60%; left:110%; " id = "Calculator">
           <input id = "display" readonly style = "width: 90%; height: 10%; position: absolute; left:5%; top:5%; font-size: 24px; background: rgb(61, 59, 59); border: white 3px solid;">
           <div id = "buttons" style = "width: 90%; height: 60%; position: absolute; left:5%; top:20%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); ">
             <button class = "button" onclick = "appendValue('+') " style = "background-color:orange;">+</button>        
             <button class = "button" onclick = "appendValue('1')">1</button>
             <button class = "button" onclick = "appendValue('2')">2</button>
             <button class = "button" onclick = "appendValue('3')">3</button>
             <button class = "button" onclick = "appendValue('-')" style = "background-color:orange;">-</button>
             <button class = "button" onclick = "appendValue('4')">4</button>
             <button class = "button" onclick = "appendValue('5')">5</button>
             <button class = "button" onclick = "appendValue('6')">6</button>
             <button class = "button" onclick = "appendValue('*')" style = "background-color:orange;">*</button>
             <button class = "button" onclick = "appendValue('7')">7</button>
             <button class = "button" onclick = "appendValue('8')">8</button>
             <button class = "button" onclick = "appendValue('9')">9</button>
             <button class = "button" onclick = "appendValue('/') " style = "background-color:orange; ">/</button>
             <button class = "button" onclick = "appendValue('0')">0</button>
             <button class = "button" onclick = "appendValue('.')">.</button>
             <button class = "button" onclick = "calculate()" style = "background-color:orange;">=</button>
             <button class = "button" onclick = "clearDisplay()" style = "background-color:orange;">C</button>
         </div>
        </div>
